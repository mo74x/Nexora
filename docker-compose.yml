version: '3.8'

services:
  # Redis for token-bucket rate limiting
  redis:
    image: redis:7-alpine
    container_name: streamgate_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redpanda (Kafka-compatible broker) for the event ingestion stream
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: streamgate_kafka
    command:
      - redpanda
      - start
      - --smp 1
      - --reserve-memory 0M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644" # Admin API
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Tenant Configuration & Analytics Aggregation
  postgres:
    image: postgres:15-alpine
    container_name: streamgate_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streamgate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: